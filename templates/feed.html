<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feed</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center mt-4">
    <div style="width: 500px;">

        {% for i in photos %}
        <div class="card mb-4 shadow-sm">

            <div class="card-header d-flex justify-content-between align-items-center">
                <h6 class="mb-0">{{ i.profile.user.username }}</h6>

                <a href="/profile_user/{{ i.profile.user.id }}" class="btn btn-sm btn-outline-primary">
                    Profile
                </a>
            </div>

            <img src="{{ i.image }}" class="card-img-top" style="max-height: 400px; object-fit: cover;">

            <div class="card-body">
                <p class="card-text mb-2">{{ i.description }}</p>

                <div class="d-flex gap-3">
                    <span>❤️ {{ i.like_set.count }}</span>
                    <span>💬 {{ i.comments_set.count }}</span>
                </div>
            </div>

        </div>

        {% empty %}
        <div class="text-center mt-5">
            <h4>No posts from people you follow</h4>
        </div>
        {% endfor %}

    </div>
</div>

</body>
</html>
