<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6f8;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        /* LEFT SIDE */
        .left-side {
            padding: 40px;
        }

        .brand-title {
            font-size: 44px;
            font-weight: 800;
            color: #111827;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 18px;
            color: #6b7280;
            margin-top: 18px;
            line-height: 1.5;
            max-width: 500px;
        }

        .highlight {
            color: #E1306C;
            font-weight: 700;
        }

        .mock-img {
            width: 100%;
            max-width: 600px;
            margin-top: 25px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        /* RIGHT SIDE */
        .auth-box {
            width: 400px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title {
            font-weight: 700;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px !important;
            border: 1px solid #e5e7eb !important;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .btn-primary {
            border-radius: 10px;
            font-weight: 600;
        }

        .small-text {
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="container wrapper">

    <div class="row w-100">

        <!-- LEFT SIDE -->
        <div class="col-md-7 left-side d-flex flex-column justify-content-center">

            <div class="brand-title">
                Присоединяйтесь к сообществу<br>
                и делитесь моментами
            </div>

            <div class="subtitle">
                Создайте аккаунт и начните делиться своими
                <span class="highlight">жизненными моментами</span>
                с друзьями и близкими.
            </div>

            <img src="https://static.cdninstagram.com/rsrc.php/yR/r/92ZsVHNkyvf.webp"
                 class="mock-img">

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-md-5 d-flex justify-content-center align-items-center">

            <div class="auth-box">

                <div class="text-center mb-4">
                    <div class="title">Create account</div>
                    <div class="subtitle">Join the network</div>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        {{ form.password1 }}
                    </div>

                    <div class="mb-3">
                        {{ form.password2 }}
                    </div>

                    <button class="btn btn-primary w-100 py-2 mt-2">
                        Sign up
                    </button>
                </form>

                <div class="text-center mt-3 small-text">
                    Already have an account?
                    <a href="/login/" style="color:#3b82f6; text-decoration:none;">
                        Sign in
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
