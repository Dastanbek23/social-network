<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6f8;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            width: 400px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title {
            font-weight: 700;
            font-size: 26px;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px !important;
            border: 1px solid #e5e7eb !important;
            background: #fff !important;
            color: #111827 !important;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .btn-primary {
            background: #3b82f6;
            border: none;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: #9ca3af;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            margin: 0 10px;
        }

        .link-text {
            font-size: 14px;
            color: #6b7280;
        }

        .link-text a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .link-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-box">

        <div class="text-center mb-4">
            <div class="title">Create account</div>
            <div class="subtitle">Join the network</div>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                {{ form.username }}
            </div>

            <div class="mb-3">
                {{ form.password1 }}
            </div>

            <div class="mb-3">
                {{ form.password2 }}
            </div>

            <button class="btn btn-primary w-100 py-2 mt-2">
                Sign up
            </button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="text-center link-text">
            Already have an account?
            <a href="/login/">Sign in</a>
        </div>

    </div>

</div>

</body>
</html>
