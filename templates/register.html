<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: radial-gradient(circle at top, #e0eafc, #cfdef3);
        }

        .auth-box {
            width: 420px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .title {
            font-weight: 700;
            letter-spacing: 1px;
        }

        input {
            border-radius: 10px !important;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 auth-box">

    <h2 class="text-center title mb-2">Create Account</h2>
    <p class="text-center text-muted mb-4">Join the network 🚀</p>

    <form method="post">
        {% csrf_token %}

        <div class="mb-2">
            {{ form.username }}
        </div>

        <div class="mb-2">
            {{ form.password1 }}
        </div>

        <div class="mb-3">
            {{ form.password2 }}
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">
            SIGN UP
        </button>
    </form>

    <hr>

    <p class="text-center mb-2 text-muted">Already have an account?</p>

    <a href="/login/" class="btn btn-outline-dark w-100 py-2">
        LOGIN
    </a>

</div>

</body>
</html>
