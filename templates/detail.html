<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center mt-4">

    <div class="card shadow" style="width: 500px;">

        <img src="{{ photo.image }}" class="card-img-top" style="max-height: 400px; object-fit: cover;">

        <div class="card-body">

            <p class="card-text">{{ photo.bio }}</p>
            <small class="text-muted">{{ photo.created_at }}</small>

            <hr>

            <div class="d-flex justify-content-between mt-2">

                <div>
                    <a href="/like/{{photo.id}}" class="btn btn-sm btn-outline-primary">Like</a>
                    <a href="/unlike/{{photo.id}}" class="btn btn-sm btn-outline-danger">Unlike</a>
                    <span class="ms-2">❤️ {{ photo.like_set.count }}</span>
                </div>

                <a href="/search/comments/{{photo.id}}" class="btn btn-sm btn-secondary">
                    Comments
                </a>

            </div>

            <div class="mt-3 d-flex gap-2">
                <a href="/delete/{{photo.id}}" class="btn btn-sm btn-danger w-50">
                    Delete
                </a>

                <a href="/profile/" class="btn btn-sm btn-dark w-50">
                    Back
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
