<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container d-flex justify-content-between">

        <a href="/profile/" class="btn btn-outline-primary">
            Главная
        </a>

        <span class="navbar-text">
            {{ user.username }}
        </span>

    </div>
</nav>
<div class="container">

    <div class="text-center mb-4">
        <h3>{{ user.username }}</h3>
        <p>Followers {{ user.following.count }}</p>
        <p>Following {{ user.follower.count }}</p>

        <a href="/search/follow/{{user.id}}" class="btn btn-primary btn-sm">Follow</a>
        <a href="/search/unfollow/{{user.id}}" class="btn btn-danger btn-sm">Unfollow</a>
    </div>

    <div class="row g-2">
        {% for i in photos %}
        <div class="col-4">

            <div class="card">
                <img src="{{ i.image }}" style="height:200px; object-fit:cover;">

                <div class="p-2 text-center">
                    <p>{{ i.bio }}</p>

                    <a href="/search/like/{{i.id}}" class="btn btn-sm btn-outline-primary">Like</a>
                    <a href="/search/unlike/{{i.id}}" class="btn btn-sm btn-outline-danger">Unlike</a>

                    <p class="mt-1">❤️ {{ i.like_set.count }}</p>

                    <a href="/search/comments/{{i.id}}" class="btn btn-sm btn-secondary">
                        Comments
                    </a>
                </div>
            </div>

        </div>
        {% endfor %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
