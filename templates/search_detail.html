<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container d-flex justify-content-between">

        <a href="/profile/" class="btn btn-outline-primary">
            Back
        </a>

        <span class="navbar-text">
            {{ users.username }}
        </span>

    </div>
</nav>
<div class="container d-flex justify-content-center mt-4">

    <div class="card shadow" style="width: 500px;">

        <img src="{{ photo.image }}" class="card-img-top" style="max-height: 400px; object-fit: cover;">

        <div class="card-body">

            <p class="card-text">{{ photo.bio }}</p>
            <small class="text-muted">{{ photo.created_at }}</small>

            <hr>

            <div class="d-flex justify-content-between align-items-center">

                <div>
                    <a href="/search/like/{{photo.id}}" class="btn btn-sm btn-outline-primary">Like</a>
                    <a href="/search/unlike/{{photo.id}}" class="btn btn-sm btn-outline-danger">Unlike</a>
                </div>

                <span>❤️ {{ photo.like_set.count }}</span>

            </div>

            <div class="mt-3">
                <a href="/search/comments/{{photo.id}}" class="btn btn-sm btn-secondary w-100">
                    Comments
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
