<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container d-flex justify-content-between">

        <a href="/profile/" class="btn btn-outline-primary">
            Главная
        </a>

        <span class="navbar-text">
            {{ users.username }}
        </span>

    </div>
</nav>
<div class="container">

<div class="text-center mb-4">
    <h3>{{ users.username }}</h3>

    <div class="d-flex justify-content-center gap-4">
    <div class="text-center">
        <h6 class="mb-0">Followers</h6>
        <p class="mb-0">{{ users.following.count }}</p>
    </div>

    <div class="text-center">
        <h6 class="mb-0">Following</h6>
        <p class="mb-0">{{ users.follower.count }}</p>
    </div>
</div>
    <br>
    <a href="/search/follow/{{users.id}}" class="btn btn-primary btn-sm">Follow</a>
    <a href="/search/unfollow/{{users.id}}" class="btn btn-danger btn-sm">Unfollow</a>
</div>

    <div class="row g-2">
        {% for i in photos %}
        <div class="col-4">

            <div class="card">
                <img src="{{ i.image }}" style="height:200px; object-fit:cover;">

                <div class="p-2 text-center">
                    <p>{{ i.bio }}</p>

                    <a href="/search/{{i.id}}" class="btn btn-sm btn-outline-primary">Show</a>
                </div>
            </div>

        </div>
        {% endfor %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
