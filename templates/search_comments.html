<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container d-flex justify-content-between">

        <a href="/profile/" class="btn btn-outline-primary">
            Back
        </a>

        <span class="navbar-text">
            {{ users.username }}
        </span>

    </div>
</nav>
<div class="container d-flex justify-content-center mt-4">

    <div class="card shadow" style="width: 500px;">

        <img src="{{ photo.image }}" class="card-img-top" style="max-height: 300px; object-fit: cover;">

        <div class="card-body">

            <p class="mb-2">{{ photo.bio }}</p>

            <hr>

            <form method="post" class="d-flex gap-2 mb-3">
                {% csrf_token %}
                <input type="text" name="comment" class="form-control" placeholder="Write comment...">
                <button class="btn btn-primary">Send</button>
            </form>

            <div>

                {% for i in comments %}
                <div class="border rounded p-2 mb-2 bg-white">

                    <b>{{ i.user.username }}</b>
                    <span class="ms-2">{{ i.comment }}</span>

                </div>
                {% empty %}
                <p class="text-center text-muted">No comments yet</p>
                {% endfor %}

            </div>

        </div>

    </div>

</div>

</body>
</html>
