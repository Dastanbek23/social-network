<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Following</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6f8;
        }

        .container-box {
            max-width: 600px;
            margin: 50px auto;
        }

        .title {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .user-card {
            background: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .user-card:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .username {
            margin-left: 10px;
            font-weight: 500;
        }

        .left {
            display: flex;
            align-items: center;
        }

        .btn-follow {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="container container-box">

    <h4 class="title">Following of {{ user.username }}</h4>

    {% for i in following %}
    <div class="user-card">

        <div class="left">
            <div class="avatar">
                {{ i.following.username|first|upper }}
            </div>

            <div class="username">
                {{ i.following.username }}
            </div>
        </div>
        <a href="/profile_user/{{i.following.id}}/">
          <button class="btn btn-outline-primary btn-follow">
            Profile
          </button>
        </a>


    </div>
    {% endfor %}

</div>

</body>
</html>
