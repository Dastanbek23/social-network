<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6f8;
        }

        /* NAVBAR */
        .navbar {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .brand {
            font-weight: 700;
        }

        .nav-link {
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-link:hover {
            color: #0d6efd !important;
            transform: translateY(-1px);
        }

        /* PROFILE STATS */
        .stats-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-item {
            transition: 0.2s;
        }

        .stat-item:hover {
            transform: scale(1.05);
        }

        /* POST CARD */
        .post-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .post-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            background: white;
            transition: 0.2s;
        }

        .post-card:hover {
            transform: translateY(-3px);
        }

        .search-input {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container-fluid px-4">

    <a class="navbar-brand brand" href="/profile/">
        {{ user.username }}
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">

      <ul class="navbar-nav me-auto align-items-lg-center">

        <li class="nav-item">
          <a class="nav-link" href="/feed/">Feed</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/create/">Create</a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-danger" href="/logout/">Logout</a>
        </li>

      </ul>

      <form class="d-flex" action="/search/" method="get">
        <input class="form-control search-input me-2"
               type="search"
               name="q"
               placeholder="Search users...">

        <button class="btn btn-outline-primary">
            Search
        </button>
      </form>

    </div>
  </div>
</nav>

<div class="container">

    <!-- PROFILE STATS -->
    <div class="stats-box">

        <h4 class="fw-bold mb-3">{{ user.username }}</h4>

        <div class="d-flex justify-content-center gap-5">

            <a href="/profile/{{user.id}}/followers/" class="text-decoration-none text-dark stat-item">
                <h6 class="text-muted mb-1">Followers</h6>
                <h5 class="mb-0 fw-bold">{{ follower }}</h5>
            </a>

            <a href="/profile/{{user.id}}/following/" class="text-decoration-none text-dark stat-item">
                <h6 class="text-muted mb-1">Following</h6>
                <h5 class="mb-0 fw-bold">{{ following }}</h5>
            </a>

        </div>

    </div>

    <!-- POSTS -->
    <div class="row g-3 justify-content-center">

        {% for i in photos %}
        <div class="col-4 col-md-3">

            <div class="post-card">

                <img src="{{ i.image }}">

                <div class="p-2 text-center">

                    <p class="mb-2 text-muted small">
                        {{ i.description }}
                    </p>

                    <a href="/detail/{{ i.id }}"
                       class="btn btn-sm btn-outline-primary rounded-pill">
                        Show
                    </a>

                </div>

            </div>

        </div>
        {% endfor %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
